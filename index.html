  }
}
:root[data-theme="dark"]{
  --ground:#101628; --surface:#1A2340; --surface-2:#243057;
  --ink:#EAF2FF; --ink-2:#A2B4D6;
  --line:#2B3862; --line-2:#3C4D7E;
  --accent:#9BC8FF; --accent-strong:#9BC8FF; --accent-ink:#12203A; --accent-soft:#25355F;
  --warn:#E5B461; --warn-soft:#372D15;
  --alert:#F08C80; --alert-soft:#3F2320;
  --d0:#9BC8FF; --d1:#E8C15E; --d2:#63D3A0; --d3:#C6AEF5;
  --ok:#63D3A0; --ok-soft:#123528;
  --scrim:rgba(4,8,18,.66);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
[hidden]{display:none !important}
h1,h2,h3{font-family:var(--sans);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--sans);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:0 60px}

/* topo */
header.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand .bt{display:flex;flex-direction:column;min-width:0}
.logo{height:38px;width:auto;flex:none;background:#fff;border-radius:7px;padding:3px 6px;box-shadow:0 1px 2px rgba(26,35,64,.12)}
@media (max-width:420px){ .logo{height:32px} }
.brand b{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:-.02em;text-transform:none;color:var(--ink);white-space:nowrap}
.brand .bt span{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.09em;font-weight:500}
.clock{text-align:right;line-height:1.2}
.clock .t{font-family:var(--sans);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock .d{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink-2);font-family:var(--sans)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav.tabs button:focus-visible,.btn:focus-visible,.turnobtn:focus-visible,.namecard:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* genéricos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:15px;font-weight:600}
.sec-head p{margin:0;font-size:12.5px;color:var(--ink-2)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:600;font-family:var(--sans)}
.muted{color:var(--ink-2)} .tiny{font-size:12.5px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 13px;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--ink-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 20px;font-size:15.5px;border-radius:11px}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.icon{padding:5px 9px;font-size:12.5px}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:8px 9px;max-width:100%}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-2);font-weight:600;font-family:var(--sans)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
  font-size:12px;font-weight:600;font-family:var(--sans);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-on{background:var(--ok-soft);color:var(--ok)}
.p-wait{background:var(--surface-2);color:var(--ink-2)}
.p-late{background:var(--warn-soft);color:var(--warn)}
.p-miss{background:var(--alert-soft);color:var(--alert)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:15px;color:var(--ink);margin-bottom:4px}
.banner{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:11px 14px;font-size:13px;font-weight:500;margin-top:14px;box-shadow:var(--shadow)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* seletor de turno */
.turnos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.turnobtn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 8px;
  cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.turnobtn b{font-family:var(--sans);font-size:14px;font-weight:600}
.turnobtn span{font-family:var(--sans);font-size:11.5px;color:var(--ink-2)}
.turnobtn[aria-pressed="true"]{background:var(--accent);border-color:transparent}
.turnobtn[aria-pressed="true"] b{color:var(--accent-ink)}
.turnobtn[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}

/* cartões de nome */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:10px}
.namecard{
  border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:14px 15px;
  min-height:78px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;width:100%;
}
.namecard:hover{border-color:var(--accent)}
.namecard .n{font-family:var(--sans);font-size:16px;font-weight:600;line-height:1.25}
.dir{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--ink-2)}
.dir-0{color:var(--d0)} .dir-1{color:var(--d1)} .dir-2{color:var(--d2)} .dir-3{color:var(--d3)}
td.dirc{font-weight:600}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;background:var(--surface-2);color:var(--ink-2);border-radius:5px;padding:1px 5px;margin-left:5px;white-space:nowrap;vertical-align:1px}
tr.passou td{opacity:.5}
.namecard .s{font-size:12.5px;color:var(--ink-2);display:flex;align-items:flex-start;gap:7px}
.namecard .s>span{flex:1;min-width:0}
.namecard .check{margin-top:1px}
.namecard.done{background:var(--ok-soft);border-color:transparent;cursor:default}
.namecard.done .n{color:var(--ok)}
.namecard.done .s{color:var(--ok)}
.namecard.done .s .mono{font-weight:600}
.namecard.late{background:var(--warn-soft)}
.namecard.late .n,.namecard.late .s{color:var(--warn)}
.check{width:18px;height:18px;flex:none}

.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar{flex:1;min-width:140px;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}

/* painel do dia */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.painel .linha{display:grid;grid-template-columns:128px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.painel .linha.first{border-top:0}
.painel .tn{font-family:var(--sans);font-weight:600;font-size:13.5px}
.painel .tn small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink-2)}
.painel .cont{font-family:var(--sans);font-size:14px;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.no{background:var(--alert-soft);color:var(--alert);font-weight:500}
.chip.late{background:var(--warn-soft);color:var(--warn);font-weight:600}
.chip .mono{font-weight:500;opacity:.85}
@media (max-width:560px){
  .painel .linha{grid-template-columns:1fr auto;gap:8px 12px}
  .painel .chips{grid-column:1 / -1}
}

/* localização */
.geo{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;border-radius:10px;padding:10px 12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);line-height:1.45}
.geo.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.geo.bad{background:var(--alert-soft);border-color:transparent;color:var(--alert);font-weight:600}
.geo svg{width:15px;height:15px;flex:none;margin-top:2px}
.regra{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px;margin-top:10px}
.regra svg{width:13px;height:13px;flex:none}

/* tabelas */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
table.data{min-width:660px}
table th,table td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
table th{font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-2);font-weight:600;background:var(--surface-2);white-space:nowrap}
table tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.num{font-family:var(--sans);font-variant-numeric:tabular-nums}
table.grade{min-width:900px}
table.grade td{vertical-align:top;border-right:1px solid var(--line)}
table.grade th{border-right:1px solid var(--line)}
table.grade th:last-child,table.grade td:last-child{border-right:0}
table.grade td.turno{background:var(--surface-2);font-family:var(--sans);font-weight:600;white-space:nowrap;min-width:132px}
table.grade td.turno small{display:block;font-family:var(--sans);font-weight:400;color:var(--ink-2);font-size:11.5px}
.nm{display:block;padding:2px 0;font-size:12.5px;line-height:1.3}
th.hoje,td.hoje{background:var(--accent-soft)}
th.hoje{color:var(--accent-strong)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:600;font-family:var(--sans)}
.tile .v{font-family:var(--sans);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .spacer{flex:1;min-width:0}

.optlist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding:2px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:9px;
  padding:9px 11px;cursor:pointer;background:var(--surface);text-align:left;width:100%;font:inherit;font-size:13.5px}
.opt b{font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.trocacard{border:1px dashed var(--line-2);border-radius:var(--r);padding:16px 18px;background:var(--surface);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.trocacard .txt{flex:1;min-width:200px}
.trocacard h2{font-size:15px;font-weight:600;margin-bottom:2px}
select.mini{font-size:12.5px;padding:4px 6px;max-width:210px}
.uchip{display:flex;align-items:center;gap:9px}
.uchip .ut{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.uchip .ut b{font-size:13px;font-weight:600}
.uchip .ut span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px;
  max-width:440px;margin:40px auto 0;box-shadow:var(--shadow)}
.gatecard h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.gatecard p{margin:0 0 18px;font-size:14px;color:var(--ink-2)}
.gatecard .btn.big{width:100%}
.namecard.esperando{opacity:.62;cursor:default}
.namecard.eu{border-color:var(--accent);border-width:2px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
  padding:20px;max-width:390px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:var(--scrim)}
dialog h3{font-size:18px;margin-bottom:4px}

footer.legal{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (prefers-reduced-motion: no-preference){
  .btn,.pill,.namecard,.turnobtn{transition:background-color .15s ease,border-color .15s ease,filter .15s ease}
}
@media (max-width:420px){
  .turnos{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
</style>

    if(ds === "todos" || ds === "Todos") return todos.slice();
    var set = {}; (ds || []).forEach(function(d){ set[d] = 1; });
    return todos.filter(function(n){ return set[diretoriaDe(n)]; });
  }
  function rotuloSabado(e){
    if(!e) return "";
    return (e.diretorias === "todos" || e.diretorias === "Todos") ? "Todas as diretorias" : (e.diretorias || []).join(" e ");
  }
  function escalados(turnoId, dow, data){
    var t = turnoDe(turnoId);
    if(t && t.sabado){ var e = sabadoDe(data); return e ? nomesDasDiretorias(e.diretorias) : []; }
    var g = (ESC.grade && ESC.grade[turnoId]) || {};
    return (g[dow] || []).slice();
  }
  function atrasoDe(turnoId, iso){
    var t = turnoDe(turnoId); if(!t) return null;
    var d = minIso(iso) - minOf(t.inicio);
    return d > TOL ? d : null;
  }

  /* ---------- localização ---------- */
  function fmtDist(d){ return d < 1000 ? Math.round(d)+" m" : (d/1000).toFixed(1).replace(".",",")+" km"; }
  function distanciaM(la1, ln1, la2, ln2){
    var R = 6371000, r = Math.PI/180;
    var a = Math.sin((la2-la1)*r/2), b = Math.sin((ln2-ln1)*r/2);
    var x = a*a + Math.cos(la1*r)*Math.cos(la2*r)*b*b;
    return 2*R*Math.asin(Math.min(1, Math.sqrt(x)));
  }
  function posicao(){
    return new Promise(function(ok, falha){
      if(!navigator.geolocation){ falha({ code:-1 }); return; }
      navigator.geolocation.getCurrentPosition(ok, falha, { enableHighAccuracy:true, timeout:15000, maximumAge:20000 });
    });
  }
  async function verificarLocal(){
    if(!GEO_ATIVO) return { ok:true, msg:"" };
    try{
      var p = await posicao();
      var d = distanciaM(p.coords.latitude, p.coords.longitude, GEO.lat, GEO.lng);
      var folga = Math.min(p.coords.accuracy || 0, 100);
      if(d - folga <= RAIO) return { ok:true, msg:"Você está no "+LOCAL_NOME+"." };
      return { ok:false, msg:"Você está a cerca de "+fmtDist(d)+" do "+LOCAL_NOME+". O ponto só pode ser registrado no local." };
    }catch(e){
      if(e && e.code === 1) return { ok:false, msg:"Permita o acesso à localização para bater o ponto. Toque no cadeado ao lado do endereço → Localização → Permitir, e tente de novo." };
      return { ok:false, msg:"Não consegui obter sua localização. Ligue o GPS, saia de perto de paredes grossas e tente de novo." };
    }
  }

    return erro(await sb.from("registros").select("id,nome,turno,data,chegada")

  async function inserir(nome, turno, data, chegada){
    if(DEMO){
      var a = demoLer("paespe-regs");
      if(a.some(function(r){ return r.nome===nome && r.turno===turno && r.data===data; })) return;
      a.push({ id:"d"+Date.now(), nome:nome, turno:turno, data:data, chegada:chegada });
      demoGravar("paespe-regs", a); return;
    }
    var r = await sb.from("registros").insert({ nome:nome, turno:turno, data:data, chegada:chegada });
    if(r.error){
      if(r.error.code === "23505") return;          // já registrado hoje
      if(r.error.code === "42501") throw new Error("O banco recusou: você só pode registrar o próprio ponto.");
      throw new Error(r.error.message);

    if(DEMO){ var a = demoLer("paespe-regs"); a.forEach(function(r){ if(String(r.id)===String(id)) r.chegada = chegada; }); demoGravar("paespe-regs", a); return; }
    erro(await sb.from("registros").update({ chegada:chegada }).eq("id", id));

  function abatido(nome, data, turno){
    return trocas.some(function(x){ return x.status==="aprovada" && x.nome===nome && x.data_abater===data && x.turno_abater===turno; });
  }
  function jaPedido(nome, data, turno){
    return trocas.some(function(x){ return x.status!=="recusada" && x.nome===nome && x.data_abater===data && x.turno_abater===turno; });
  }
  function trocaDoRegistro(r){
    for(var i=0;i<trocas.length;i++){ var x=trocas[i]; if(x.nome===r.nome && x.data===r.data && x.turno===r.turno) return x; }
    return null;
  }
  function plantoesDe(nome, ym){
    var p = ym.split("-"), ult = new Date(+p[0], +p[1], 0).getDate(), out = [];
    for(var d=1; d<=ult; d++){
      var dt = new Date(+p[0], +p[1]-1, d);
      var key = dt.toLocaleDateString("sv-SE"), dow = dt.getDay();
      turnosDe(dow).forEach(function(t){
        if(escalados(t.id, dow, key).indexOf(nome) >= 0 && !jaPedido(nome, key, t.id))
          out.push({ data:key, turno:t.id, dow:dow });
      });
    }
    return out;
  }

      entrarNoApp();

      return;
    }
    if(!window.supabase || !window.supabase.createClient){
      telaMensagem("Biblioteca não carregou", "O site não conseguiu carregar a biblioteca de login. Verifique sua conexão e recarregue a página.");
      return;
    }
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY,
      { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"pkce" } });

    sb.auth.onAuthStateChange(function(_ev, s){
      var mudou = (!!s) !== (!!sessao) || (s && sessao && s.user.id !== sessao.user.id);
      sessao = s;
      if(mudou) iniciarSessao();
    });
    var g = await sb.auth.getSession();
    sessao = g.data ? g.data.session : null;
    iniciarSessao();

  async function iniciarSessao(){
    if(!sessao){ pronto = false; telaLogin(); return; }
    try{ perfil = await carregarMeuPerfil(); }
    catch(e){ telaMensagem("Não consegui carregar seu perfil", e.message); return; }
    if(!perfil.aprovado){ pronto = false; telaPendente(); return; }
    entrarNoApp();
  }

  async function carregarMeuPerfil(){
    var uid = sessao.user.id;
    var rpc = await sb.rpc("registrar_perfil");
    if(!rpc.error && rpc.data && rpc.data.length) return rpc.data[0];
    var r = await sb.from("perfis").select("id,email,nome,papel,aprovado").eq("id", uid).maybeSingle();
    if(r.error) throw new Error(r.error.message);
    if(!r.data){
      var ins = await sb.from("perfis").insert({ id:uid, email:sessao.user.email });
      if(ins.error && ins.error.code !== "23505") throw new Error(ins.error.message);
      r = await sb.from("perfis").select("id,email,nome,papel,aprovado").eq("id", uid).maybeSingle();
      if(r.error) throw new Error(r.error.message);
    }
    return r.data || { id:uid, email:sessao.user.email, nome:null, papel:"instrutor", aprovado:false };
  }

  /* ================= REGISTRAR ================= */

  function painelHoje(dow, data){
    var lista = turnosDe(dow), total = 0, presentes = 0, corpo = "";
    lista.forEach(function(t, i){
      var nomes = escalados(t.id, dow, data);
      var reg = {};
      regsHoje.forEach(function(r){ if(r.turno===t.id) reg[r.nome] = r; });
      var chegaram = nomes.filter(function(n){ return reg[n]; });
      var faltam = nomes.filter(function(n){ return !reg[n]; });
      total += nomes.length; presentes += chegaram.length;
      corpo += '<div class="linha'+(i===0?" first":"")+'">'
        + '<div class="tn">'+esc(t.nome)+'<small>'+esc(t.inicio)+'–'+esc(t.fim)+'</small></div><div class="chips">';
      if(!nomes.length){ corpo += '<span class="chip">sem escala neste dia</span>'; }
      else {
        chegaram.forEach(function(n){
          var at = atrasoDe(t.id, reg[n].chegada);
          corpo += '<span class="chip '+(at!=null?"late":"ok")+'">'+esc(nomeCurto(n))+' <span class="mono">'+esc(hhmm(reg[n].chegada))+'</span></span>';
        });
        faltam.forEach(function(n){ corpo += '<span class="chip no">'+esc(nomeCurto(n))+'</span>'; });
      }
      corpo += '</div><div class="cont"'+(nomes.length && chegaram.length===nomes.length ? ' style="color:var(--ok)"' : '')+'>'
        + chegaram.length+'/'+nomes.length+'</div></div>';
    });
    return '<div class="painel"><div class="sec-head" style="margin-bottom:2px"><h2>Quem já chegou hoje</h2>'
      + '<p>'+presentes+' de '+total+' turnos preenchidos · verde é presente, amarelo é atraso, vermelho ainda não chegou</p>'
      + '</div>' + corpo + '</div>';
  }

  function abrirConfirma(nome){
    var t = turnoDe(turnoSel);
    alvoConf = { nome:nome, turno:turnoSel };
    el("dc-nome").textContent = nomeCheio(nome);
    el("dc-sub").textContent = t.nome + " · " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
      + " · " + new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
    el("dlg-conf").showModal();
    checarNoDialogo();
  }
  async function checarNoDialogo(){
    var faixa = el("dc-geo"), ok = el("dc-ok"), retry = el("dc-retry");
    if(!GEO_ATIVO){ faixa.hidden = true; ok.disabled = false; retry.hidden = true; return; }
    faixa.hidden = false; retry.hidden = true; faixa.className = "geo";
    faixa.innerHTML = SVG_PIN + "<span>Verificando sua localização…</span>";
    ok.disabled = true;
    var r = await verificarLocal();
    if(!el("dlg-conf").open) return;
    faixa.className = "geo " + (r.ok ? "ok" : "bad");
    faixa.innerHTML = SVG_PIN + "<span>" + esc(r.msg) + "</span>";
    ok.disabled = !r.ok;
    retry.hidden = r.ok;
  }
  el("dc-retry").addEventListener("click", checarNoDialogo);
  el("dc-no").addEventListener("click", function(){ el("dlg-conf").close(); });
  el("dc-ok").addEventListener("click", async function(){
    var a = alvoConf; if(!a) return;
    var btn = el("dc-ok"); btn.disabled = true;
    var agora = new Date().toISOString();
    try{
      await inserir(a.nome, a.turno, hojeKey(), agora);
      el("dlg-conf").close();
      aviso("Chegada registrada às "+hhmm(agora)+".");
      await carregarHoje();
    }catch(e){
      el("dlg-conf").close();
      aviso("Não consegui registrar. "+e.message, "warn");
    }
    btn.disabled = false;
  });

  /* ---------- troca ---------- */
  function abrirTroca(){
    var t = turnoDe(turnoSel);
    trocaSel = null; trocaGeoOk = false;
    trocaMes = hojeKey().slice(0,7);
    el("tr-sub").textContent = "Presença de hoje: " + t.nome + ", "
      + new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) + ".";
    el("tr-quem").textContent = nomeCheio(meuNome());
    el("tr-mes").value = trocaMes;
    el("tr-geo").hidden = true;
    el("tr-ok").disabled = true;
    pintarPlantoes();
    el("dlg-troca").showModal();
  }
  function pintarPlantoes(){
    var nome = meuNome(), alvo = el("tr-lista");
    trocaSel = null; trocaGeoOk = false;
    el("tr-ok").disabled = true; el("tr-geo").hidden = true;
    var lista = plantoesDe(nome, trocaMes);
    if(!lista.length){
      alvo.innerHTML = '<p class="tiny muted" style="margin:6px 0 0">Nenhum plantão disponível neste mês (ou todos já têm troca solicitada). Escolha outro mês.</p>';
      return;
    }
    alvo.innerHTML = '<div class="optlist">' + lista.map(function(x, i){
      var t = turnoDe(x.turno);
      return '<button class="opt" data-i="'+i+'" aria-pressed="false">'
        + '<b>'+DIA_CURTO[x.dow]+' '+esc(brData(x.data).slice(0,5))+'</b>'
        + '<span>'+esc(t.nome)+' · '+esc(t.inicio)+'–'+esc(t.fim)+'</span></button>';
    }).join("") + '</div>';
    Array.prototype.forEach.call(alvo.querySelectorAll(".opt"), function(b){
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(alvo.querySelectorAll(".opt"), function(o){ o.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        trocaSel = lista[+b.dataset.i];
        checarGeoTroca();
      });
    });
  }
  async function checarGeoTroca(){
    var faixa = el("tr-geo"), ok = el("tr-ok");
    if(!GEO_ATIVO){ faixa.hidden = true; trocaGeoOk = true; ok.disabled = false; return; }
    faixa.hidden = false; faixa.className = "geo";
    faixa.innerHTML = SVG_PIN + "<span>Verificando sua localização…</span>";
    ok.disabled = true;
    var r = await verificarLocal();
    if(!el("dlg-troca").open) return;
    trocaGeoOk = r.ok;
    faixa.className = "geo " + (r.ok ? "ok" : "bad");
    faixa.innerHTML = SVG_PIN + "<span>" + esc(r.msg) + "</span>";
    ok.disabled = !r.ok || !trocaSel;
  }
  el("tr-no").addEventListener("click", function(){ el("dlg-troca").close(); });
  el("tr-mes").addEventListener("change", function(){ trocaMes = this.value || hojeKey().slice(0,7); pintarPlantoes(); });
  el("tr-ok").addEventListener("click", async function(){
    var nome = meuNome();
    if(!nome || !trocaSel || !trocaGeoOk) return;
    var btn = el("tr-ok"); btn.disabled = true;
    try{
      await inserirTroca({ nome:nome, data:hojeKey(), turno:turnoSel,
                           data_abater:trocaSel.data, turno_abater:trocaSel.turno, status:"pendente" });
      await inserir(nome, turnoSel, hojeKey(), new Date().toISOString());
      el("dlg-troca").close();
      aviso("Presença registrada e troca enviada para aprovação da coordenação.");
      await carregarHoje();
    }catch(e){ aviso("Não consegui enviar. "+e.message, "warn"); }
    btn.disabled = false;
  });

  /* ================= ESCALA ================= */
  function viewEscala(){
    var dow = new Date().getDay();
    var passa = function(n){ return !filtroDir || diretoriaDe(n) === filtroDir; };
    var h = '<div class="toolbar" style="margin-bottom:-6px">'
      + '<label class="fld">Diretoria<select id="f-dir"><option value="">Todas</option>'
      + DIRETORIAS.map(function(d){ return '<option value="'+esc(d)+'"'+(d===filtroDir?" selected":"")+'>'+esc(d)+'</option>'; }).join("")
      + '</select></label></div>';

    h += '<div><div class="sec-head"><h2>Grade de segunda a sexta</h2>'
      + '<p>Definida pela coordenação · a coluna de hoje aparece destacada'
      + (filtroDir ? ' · filtrando '+esc(filtroDir) : '')+'</p></div>'
      + '<div class="tblwrap"><table class="grade"><thead><tr><th>Turno</th>'
      + UTEIS.map(function(d){
          var nm = DIA_LONGO[d].replace("-feira","");
          return '<th'+(d===dow?' class="hoje"':'')+'>'+nm.charAt(0).toUpperCase()+nm.slice(1)+'</th>';
        }).join("") + '</tr></thead><tbody>';
    TURNOS_SEMANA.forEach(function(t){
      h += '<tr><td class="turno">'+esc(t.nome)+'<small>'+esc(t.inicio)+' – '+esc(t.fim)+'</small></td>';
      UTEIS.forEach(function(d){
        var ns = escalados(t.id, d, "").filter(passa);
        h += '<td'+(d===dow?' class="hoje"':'')+'>'
          + (ns.length ? ns.map(function(n){ return '<span class="nm'+classeDir(diretoriaDe(n))+'">'+esc(nomeCurto(n))+'</span>'; }).join("") : '<span class="muted">—</span>')
          + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';

    if(TURNO_SAB){
      var hoje = hojeKey();
      var futuros = SABADOS.slice().sort(function(a,b){ return a.data < b.data ? -1 : 1; });
      h += '<div><div class="sec-head"><h2>Sábados</h2><p>'
        + esc(TURNO_SAB.inicio)+' – '+esc(TURNO_SAB.fim)+' · por diretoria, nas datas marcadas</p></div>';
      if(!futuros.length){
        h += '<div class="empty"><h3>Nenhum sábado cadastrado</h3></div>';
      } else {
        h += '<div class="tblwrap"><table><thead><tr><th>Data</th><th>Diretorias</th><th class="num">Instrutores</th></tr></thead><tbody>';
        futuros.forEach(function(e){
          var ns = nomesDasDiretorias(e.diretorias).filter(passa);
          h += '<tr'+(e.data < hoje ? ' class="passou"' : '')+'>'
            + '<td class="mono">'+esc(brData(e.data))+' <span class="muted">'+DIA_CURTO[dowDe(e.data)]+'</span>'
            + (e.data===hoje ? ' <span class="pill p-on"><span class="dot"></span>hoje</span>' : '')+'</td>'
            + '<td>'+esc(rotuloSabado(e))+'</td><td class="num">'+ns.length+'</td></tr>';
        });
        h += '</tbody></table></div>';
      }
      h += '</div>';
    }

    var todos = Object.keys(INSTRUTORES).filter(passa).sort(ordenaPorNome);
    var turnosSem = {};
    TURNOS_SEMANA.forEach(function(t){ UTEIS.forEach(function(d){ escalados(t.id,d,"").forEach(function(n){ turnosSem[n] = (turnosSem[n]||0)+1; }); }); });
    h += '<div><div class="sec-head"><h2>Instrutores</h2><p>'+todos.length+' pessoas · turnos por semana</p></div>'
      + '<div class="tblwrap"><table><thead><tr><th>Instrutor(a)</th><th>Curso</th><th>Diretoria</th><th class="num">Turnos/semana</th></tr></thead><tbody>'
      + todos.map(function(n){
          var d = diretoriaDe(n), i = infoDe(n);
          return '<tr><td>'+(i.diretor?'<b>'+esc(nomeCheio(n))+'</b> <span class="tag">diretor(a)</span>':esc(nomeCheio(n)))+'</td>'
            + '<td'+(i.curso?'':' class="muted"')+'>'+esc(i.curso || "—")+'</td>'
            + '<td class="'+(d?('dirc'+classeDir(d)):'muted')+'">'+esc(d||"a definir")+'</td>'
            + '<td class="num">'+(turnosSem[n]||0)+'</td></tr>';
        }).join("")
      + '</tbody></table></div></div>';

    el("v-escala").innerHTML = h;
    el("f-dir").addEventListener("change", function(){ filtroDir = this.value; render(); });
  }

  /* ================= COORDENAÇÃO ================= */
  function viewCoord(){
    var box = el("v-coord");
    if(!ehCoord()){ box.innerHTML = '<div class="empty"><h3>Área restrita à coordenação</h3></div>'; return; }

    var p = mesFiltro.split("-");
    var ultimoDia = new Date(+p[0], +p[1], 0).getDate();
    var hoje = hojeKey();
    var porNome = {};
    function slot(n){ return porNome[n] || (porNome[n] = { previstos:0, presentes:0, atrasos:0 }); }
    for(var d=1; d<=ultimoDia; d++){
      var dt = new Date(+p[0], +p[1]-1, d);
      var key = dt.toLocaleDateString("sv-SE");
      if(key > hoje) break;
      var dow = dt.getDay();
      turnosDe(dow).forEach(function(t){
        escalados(t.id, dow, key).forEach(function(n){ if(!abatido(n, key, t.id)) slot(n).previstos++; });
      });
    }
    var atrasosTot = 0;
    regsMes.forEach(function(r){
      var s = slot(r.nome); s.presentes++;
      if(atrasoDe(r.turno, r.chegada) != null){ s.atrasos++; atrasosTot++; }
    });
    var nomes = Object.keys(porNome).sort(ordenaPorNome);
    var previstosTot = nomes.reduce(function(a,n){ return a + porNome[n].previstos; }, 0);
    var freq = previstosTot ? Math.round(regsMes.length / previstosTot * 100) : 0;

    var h = '<div class="toolbar">'
      + '<label class="fld">Período<input type="month" id="f-mes" value="'+esc(mesFiltro)+'"></label>'
      + '<span class="spacer"></span>'
      + '<button class="btn ghost" id="btn-coord-gps">Minhas coordenadas</button>'
      + '<button class="btn ghost" id="btn-recarregar">Atualizar</button>'
      + '<button class="btn" id="btn-csv">Baixar CSV</button></div><div id="saida-gps"></div>';

    h += '<div class="tiles">'
      + tile("Presenças", String(regsMes.length))
      + tile("Turnos previstos", String(previstosTot))
      + tile("Frequência", freq+"%")
      + tile("Chegadas com atraso", String(atrasosTot))
      + '</div>';

    /* contas */
    var usados = {};
    perfis.forEach(function(x){ if(x.nome) usados[x.nome] = x.id; });
    function opcoesNome(sel, dono){
      return '<option value="">— sem nome —</option>' + Object.keys(INSTRUTORES).sort(ordenaPorNome)
        .filter(function(n){ return !usados[n] || usados[n] === dono || n === sel; })
        .map(function(n){ return '<option value="'+esc(n)+'"'+(n===sel?" selected":"")+'>'+esc(nomeCheio(n))+'</option>'; }).join("");
    }
    var pendentes = perfis.filter(function(x){ return !x.aprovado; });
    var emailsComConta = {};
    perfis.forEach(function(x){ if(x.email) emailsComConta[x.email.toLowerCase()] = 1; });
    var convAbertos = convites.filter(function(c){ return !emailsComConta[(c.email||"").toLowerCase()]; });

    h += '<div><div class="sec-head"><h2>Contas</h2><p>'
      + (pendentes.length ? pendentes.length+' aguardando liberação' : 'nenhuma pendente')
      + (convAbertos.length ? ' · '+convAbertos.length+' convite'+(convAbertos.length===1?'':'s')+' sem uso' : '')
      + '</p></div>';

    h += '<div class="card" style="margin-bottom:12px">'
      + '<div class="addform" style="border-top:0;padding-top:0;margin-top:0">'
      +   '<label class="fld">E-mail<input id="cv-email" type="email" placeholder="pessoa@gmail.com" size="24"></label>'
      +   '<label class="fld">Nome<select id="cv-nome">'+opcoesNome("", null)+'</select></label>'
      +   '<label class="fld">Perfil<select id="cv-papel">'
      +     '<option value="instrutor">Instrutor(a)</option><option value="coordenacao">Coordenação</option>'
      +   '</select></label>'
      +   '<button class="btn primary" id="cv-ok">Adicionar</button>'
      + '</div>'
      + '<p class="tiny muted" style="margin:10px 0 0">Quem for adicionado aqui entra com o Google usando esse e-mail e já cai liberado, '
      + 'sem precisar de aprovação. Contas Google não podem ser criadas por aqui — a pessoa usa a dela.</p></div>';

    if(convAbertos.length){
      h += '<div class="tblwrap" style="margin-bottom:12px"><table class="data"><thead><tr>'
        + '<th>Convite em aberto</th><th>Nome</th><th>Perfil</th><th></th></tr></thead><tbody>'
        + convAbertos.map(function(c){
            return '<tr><td>'+esc(c.email)+'</td>'
              + '<td>'+(c.nome ? esc(nomeCheio(c.nome)) : '<span class="muted">—</span>')+'</td>'
              + '<td>'+(c.papel==="coordenacao" ? 'coordenação' : 'instrutor(a)')+'</td>'
              + '<td><button class="btn icon ghost" data-delconv="'+esc(c.email)+'" style="color:var(--alert)">Remover</button></td></tr>';
          }).join("")
        + '</tbody></table></div>';
    }

    h += '<div class="tblwrap"><table class="data"><thead><tr><th>E-mail</th><th>Nome</th>'
      + '<th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>';
    perfis.slice().sort(function(a,b){ return (a.aprovado?1:0) - (b.aprovado?1:0); }).forEach(function(x){
      h += '<tr><td>'+esc(x.email||"—")+'</td>'
        + '<td><select class="mini" data-nome="'+esc(x.id)+'">'+opcoesNome(x.nome, x.id)+'</select></td>'
        + '<td>'+(x.papel==="coordenacao" ? '<span class="pill p-on"><span class="dot"></span>coordenação</span>' : 'instrutor(a)')+'</td>'
        + '<td>'+(x.aprovado ? '<span class="pill p-on"><span class="dot"></span>liberada</span>' : '<span class="pill p-late">pendente</span>')+'</td>'
        + '<td style="white-space:nowrap">'
        + (x.aprovado
            ? '<button class="btn icon ghost" data-bloq="'+esc(x.id)+'">Bloquear</button> '
            : '<button class="btn icon" data-lib="'+esc(x.id)+'">Liberar</button> ')
        + (x.papel==="coordenacao" ? '' : '<button class="btn icon ghost" data-prom="'+esc(x.id)+'">Tornar coordenação</button>')
        + '</td></tr>';
    });
    h += '</tbody></table></div></div>';

    /* diretorias */
    var porDir = {};
    nomes.forEach(function(n){
      var dd = diretoriaDe(n) || "Sem diretoria";
      var s = porDir[dd] || (porDir[dd] = { previstos:0, presentes:0, atrasos:0, pessoas:0 });
      s.previstos += porNome[n].previstos; s.presentes += porNome[n].presentes;
      s.atrasos += porNome[n].atrasos; s.pessoas++;
    });
    var dirs = DIRETORIAS.filter(function(d){ return porDir[d]; });
    Object.keys(porDir).forEach(function(d){ if(dirs.indexOf(d) < 0) dirs.push(d); });
    if(dirs.length){
      h += '<div><div class="sec-head"><h2>Por diretoria</h2><p>'+esc(nomeMes(mesFiltro))+'</p></div>'
        + '<div class="tblwrap"><table class="data"><thead><tr><th>Diretoria</th><th class="num">Pessoas</th>'
        + '<th class="num">Previstos</th><th class="num">Presenças</th><th class="num">Faltas</th>'
        + '<th class="num">Atrasos</th><th class="num">Frequência</th></tr></thead><tbody>'
        + dirs.map(function(d){
            var s = porDir[d], faltas = Math.max(0, s.previstos - s.presentes);
            var pc = s.previstos ? Math.round(s.presentes/s.previstos*100) : 0;
            return '<tr><td class="dirc'+classeDir(d)+'">'+esc(d)+'</td><td class="num">'+s.pessoas+'</td>'
              + '<td class="num">'+s.previstos+'</td><td class="num">'+s.presentes+'</td>'
              + '<td class="num"'+(faltas?' style="color:var(--alert)"':'')+'>'+faltas+'</td>'
              + '<td class="num"'+(s.atrasos?' style="color:var(--warn)"':'')+'>'+s.atrasos+'</td>'
              + '<td class="num">'+pc+'%</td></tr>';
          }).join("") + '</tbody></table></div></div>';
    }

    /* trocas */
    var pend = trocas.filter(function(x){ return x.status === "pendente"; });
    var decid = trocas.filter(function(x){ return x.status !== "pendente"; }).slice(0,20);
    if(pend.length || decid.length){
      h += '<div><div class="sec-head"><h2>Solicitações de troca</h2><p>'
        + (pend.length ? pend.length+' aguardando decisão' : 'nenhuma pendente')+'</p></div>'
        + '<div class="tblwrap"><table class="data"><thead><tr><th>Instrutor(a)</th><th>Compareceu</th>'
        + '<th>Plantão que sai</th><th>Situação</th><th></th></tr></thead><tbody>';
      pend.concat(decid).forEach(function(x){
        var te = turnoDe(x.turno), ta = turnoDe(x.turno_abater);
        var sit = x.status === "pendente" ? '<span class="pill p-late">Pendente</span>'
          : (x.status === "aprovada" ? '<span class="pill p-on"><span class="dot"></span>Aprovada</span>'
          : '<span class="pill p-miss">Recusada</span>');
        h += '<tr><td>'+esc(nomeCheio(x.nome))+'</td>'
          + '<td class="mono">'+esc(brData(x.data))+' <span class="muted">'+esc(te?te.nome:x.turno)+'</span></td>'
          + '<td class="mono">'+esc(brData(x.data_abater))+' <span class="muted">'+esc(ta?ta.nome:x.turno_abater)+'</span></td>'
          + '<td>'+sit+'</td><td style="white-space:nowrap">'
          + (x.status==="pendente"
              ? '<button class="btn icon" data-ap="'+esc(x.id)+'">Aprovar</button> <button class="btn icon ghost" data-re="'+esc(x.id)+'" style="color:var(--alert)">Recusar</button>'
              : '<button class="btn icon ghost" data-ap="'+esc(x.id)+'">Reabrir como aprovada</button>')
          + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }

    h += '<div><div class="sec-head"><h2>Por instrutor</h2><p>'+esc(nomeMes(mesFiltro))+' · até hoje</p></div>';
    if(!nomes.length){ h += '<div class="empty"><h3>Nada a mostrar neste período</h3></div>'; }
    else {
      h += '<div class="tblwrap"><table class="data"><thead><tr><th>Instrutor(a)</th><th>Diretoria</th>'
        + '<th class="num">Previstos</th><th class="num">Presenças</th><th class="num">Faltas</th>'
        + '<th class="num">Atrasos</th><th class="num">Frequência</th></tr></thead><tbody>';
      nomes.forEach(function(n){
        var s = porNome[n], faltas = Math.max(0, s.previstos - s.presentes);
        var pc = s.previstos ? Math.round(s.presentes/s.previstos*100) : 0;
        h += '<tr><td>'+esc(nomeCheio(n))+'</td><td class="muted">'+esc(diretoriaDe(n) || "—")+'</td>'
          + '<td class="num">'+s.previstos+'</td><td class="num">'+s.presentes+'</td>'
          + '<td class="num"'+(faltas?' style="color:var(--alert)"':'')+'>'+faltas+'</td>'
          + '<td class="num"'+(s.atrasos?' style="color:var(--warn)"':'')+'>'+s.atrasos+'</td>'
          + '<td class="num">'+pc+'%</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';

    var ordenados = regsMes.slice().sort(function(a,b){ return new Date(b.chegada) - new Date(a.chegada); });
    if(ordenados.length){
      h += '<div><div class="sec-head"><h2>Registros</h2><p>'+ordenados.length+' chegada'+(ordenados.length===1?"":"s")+' · mais recentes primeiro</p></div>'
        + '<div class="tblwrap"><table class="data"><thead><tr><th>Data</th><th>Turno</th><th>Instrutor(a)</th>'
        + '<th>Diretoria</th><th>Chegada</th><th>Situação</th><th></th></tr></thead><tbody>';
      ordenados.slice(0,200).forEach(function(r, i){
        var at = atrasoDe(r.turno, r.chegada), t = turnoDe(r.turno), tx = trocaDoRegistro(r);
        h += '<tr><td class="mono">'+esc(brData(r.data))+' <span class="muted">'+DIA_CURTO[dowDe(r.data)]+'</span></td>'
          + '<td>'+esc(t ? t.nome : r.turno)+'</td><td>'+esc(nomeCheio(r.nome))+'</td>'
          + '<td class="muted">'+esc(diretoriaDe(r.nome) || "—")+'</td>'
          + '<td class="mono">'+esc(hhmm(r.chegada))+'</td>'
          + '<td>'+(at!=null ? '<span class="pill p-late">+'+at+' min</span>' : '<span class="pill p-on"><span class="dot"></span>No horário</span>')
          + (tx ? ' <span class="pill '+(tx.status==="aprovada"?"p-on":(tx.status==="recusada"?"p-miss":"p-late"))+'">troca '+esc(tx.status)+'</span>' : '')+'</td>'
          + '<td><button class="btn icon ghost" data-fix="'+i+'">Corrigir</button></td></tr>';
      });
      h += '</tbody></table></div>';
      if(ordenados.length>200) h += '<p class="tiny muted" style="margin:8px 0 0">Mostrando os 200 mais recentes; o CSV traz o período inteiro.</p>';
      h += '</div>';
    }

    box.innerHTML = h;
    el("f-mes").addEventListener("change", function(){ mesFiltro = this.value || hojeKey().slice(0,7); carregarMes(); });
    el("btn-recarregar").addEventListener("click", carregarMes);
    el("btn-csv").addEventListener("click", function(){ baixarCSV(ordenados); });
    el("btn-coord-gps").addEventListener("click", async function(){
      var alvo = el("saida-gps");
      alvo.innerHTML = '<div class="geo" style="margin-top:12px">'+SVG_PIN+'<span>Lendo o GPS…</span></div>';
      try{
        var pos = await posicao();
        alvo.innerHTML = '<div class="geo ok" style="margin-top:12px">'+SVG_PIN
          + '<span>Precisão de cerca de '+Math.round(pos.coords.accuracy)+' m. Cole no <span class="mono">config.js</span>:<br>'
          + '<span class="mono" style="font-size:14px">lat: '+pos.coords.latitude.toFixed(6)
          + ',&nbsp; lng: '+pos.coords.longitude.toFixed(6)+'</span></span></div>';
      }catch(e){
        alvo.innerHTML = '<div class="geo bad" style="margin-top:12px">'+SVG_PIN+'<span>Não consegui ler o GPS.</span></div>';
      }
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-fix]"), function(b){
      b.addEventListener("click", function(){ abrirFix(ordenados[+b.dataset.fix]); });
    });
    ligar(box, "data-ap", function(id){ return decidirTroca(id, "aprovada"); }, "Troca aprovada.");
    ligar(box, "data-re", function(id){ return decidirTroca(id, "recusada"); }, "Troca recusada.");
    ligar(box, "data-lib",  function(id){ return mudarPerfil(id, { aprovado:true }); }, "Conta liberada.");
    ligar(box, "data-bloq", function(id){ return mudarPerfil(id, { aprovado:false }); }, "Conta bloqueada.");
    ligar(box, "data-prom", function(id){ return mudarPerfil(id, { papel:"coordenacao" }); }, "Perfil alterado.");
    ligar(box, "data-delconv", function(em){ return apagarConvite(em); }, "Convite removido.");
    Array.prototype.forEach.call(box.querySelectorAll("[data-nome]"), function(sel){
      sel.addEventListener("change", async function(){
        sel.disabled = true;
        try{ await mudarPerfil(sel.dataset.nome, { nome: sel.value || null }); aviso("Nome atualizado."); await carregarMes(); }
        catch(e){ aviso(/duplicate|unique/i.test(e.message) ? "Esse nome já está em outra conta." : e.message, "warn"); sel.disabled = false; }
      });
    });
    var cv = el("cv-ok");
    if(cv) cv.addEventListener("click", async function(){
      var em = (el("cv-email").value||"").trim().toLowerCase();
      if(!em || em.indexOf("@") < 0){ aviso("Informe um e-mail válido."); return; }
      cv.disabled = true;
      try{
        await criarConvite({ email:em, nome: el("cv-nome").value || null, papel: el("cv-papel").value });
        aviso("Adicionado. Peça para a pessoa entrar com o Google usando esse e-mail.");
        await carregarMes();
      }catch(e){ aviso("Não consegui adicionar. ("+e.message+")", "warn"); cv.disabled = false; }
    });
  }
  function ligar(box, attr, fn, ok){
    Array.prototype.forEach.call(box.querySelectorAll("["+attr+"]"), function(b){
      b.addEventListener("click", async function(){
        b.disabled = true;
        try{ await fn(b.getAttribute(attr)); aviso(ok); await carregarMes(); }
        catch(e){ aviso("Não consegui. ("+e.message+")", "warn"); b.disabled = false; }
      });
    });
  }
  async function mudarPerfil(id, patch){
    if(DEMO) return;
    erro(await sb.from("perfis").update(patch).eq("id", id));
  }
  function tile(k,v){ return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }

  function abrirFix(r){
    alvoFix = r;
    var t = turnoDe(r.turno);
    el("df-sub").textContent = nomeCheio(r.nome) + " · " + (t?t.nome:r.turno) + " · " + brData(r.data);
    el("df-h").value = hhmm(r.chegada);
    el("dlg-fix").showModal();
  }
  el("df-no").addEventListener("click", function(){ el("dlg-fix").close(); });
  el("df-ok").addEventListener("click", async function(){
    var r = alvoFix; if(!r) return;
    var v = el("df-h").value;
    if(!v){ aviso("Informe o horário."); return; }
    var p = v.split(":");
    var d = new Date(r.data+"T00:00:00"); d.setHours(+p[0], +p[1], 0, 0);
    el("dlg-fix").close();
    try{ await alterar(r.id, d.toISOString()); aviso("Registro corrigido."); await carregarMes(); await carregarHoje(); }
    catch(e){ aviso("Não consegui corrigir. ("+e.message+")", "warn"); }
  });
  el("df-del").addEventListener("click", async function(){
    var r = alvoFix; if(!r) return;
    el("dlg-fix").close();
    try{ await remover(r.id); aviso("Registro apagado."); await carregarMes(); await carregarHoje(); }
    catch(e){ aviso("Não consegui apagar. ("+e.message+")", "warn"); }
  });

  function baixarCSV(rows){
    var head = ["Data","Dia","Turno","Instrutor(a)","Diretoria","Curso","Chegada","Atraso (min)","Situação","Troca"];
    var out = [head.join(";")];
    rows.slice().reverse().forEach(function(r){
      var at = atrasoDe(r.turno, r.chegada), t = turnoDe(r.turno), tx = trocaDoRegistro(r);
      out.push([brData(r.data), DIA_CURTO[dowDe(r.data)], t?t.nome:r.turno, nomeCheio(r.nome),
        diretoriaDe(r.nome), infoDe(r.nome).curso || "", hhmm(r.chegada),
        at!=null?String(at):"", at!=null?"Atraso":"No horário", tx ? tx.status : ""]
        .map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(";"));
    });
    var blob = new Blob(["﻿"+out.join("\r\n")], { type:"text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "frequencia-paespe-"+mesFiltro+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function turnoAtual(){
    var lista = turnosDe(new Date().getDay());
    if(!lista.length) return null;
    var m = agoraMin(), prox = null;
    for(var i=0;i<lista.length;i++){
      var t = lista[i];
      if(m >= minOf(t.inicio) - 60 && m <= minOf(t.fim) + 30) return t.id;
      if(m < minOf(t.inicio) && !prox) prox = t.id;
    }
    return prox || lista[0].id;
  }

  boot();
})();
</script>
</body>
</html>
